<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 190" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <title>Espectro de licencias de software</title>
  <rect width="900" height="190" fill="#ffffff"/>
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#d1495b"/>
      <stop offset="0.5" stop-color="#edae49"/>
      <stop offset="1" stop-color="#2a9d8f"/>
    </linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#555"/></marker>
  </defs>
  <rect x="20" y="20" width="860" height="10" rx="5" fill="url(#g)"/>
  <g font-size="14" text-anchor="middle">
    <g transform="translate(20,48)"><rect width="135" height="84" rx="10" fill="#fbe3e6" stroke="#d1495b"/><text x="67" y="30" font-weight="700" fill="#7a1f2b">Privativo</text><text x="67" y="54" font-size="12" fill="#333">Windows</text><text x="67" y="70" font-size="12" fill="#333">Office</text></g>
    <g transform="translate(165,48)"><rect width="135" height="84" rx="10" fill="#fdecd9" stroke="#e07a3f"/><text x="67" y="30" font-weight="700" fill="#7a3b12">Shareware</text><text x="67" y="54" font-size="12" fill="#333">WinRAR</text><text x="67" y="70" font-size="12" fill="#333">(prueba)</text></g>
    <g transform="translate(310,48)"><rect width="135" height="84" rx="10" fill="#fdf3dc" stroke="#edae49"/><text x="67" y="30" font-weight="700" fill="#6b4b0c">Freeware</text><text x="67" y="54" font-size="12" fill="#333">Chrome</text><text x="67" y="70" font-size="12" fill="#333">Acrobat Reader</text></g>
    <g transform="translate(455,48)"><rect width="135" height="84" rx="10" fill="#e3f1e8" stroke="#5a9e6f"/><text x="67" y="30" font-weight="700" fill="#24503a">Copyleft</text><text x="67" y="54" font-size="12" fill="#333">GPL</text><text x="67" y="70" font-size="12" fill="#333">Linux, GIMP</text></g>
    <g transform="translate(600,48)"><rect width="135" height="84" rx="10" fill="#dcf0ee" stroke="#2a9d8f"/><text x="67" y="30" font-weight="700" fill="#14504a">Permisivo</text><text x="67" y="54" font-size="12" fill="#333">MIT, BSD</text><text x="67" y="70" font-size="12" fill="#333">Apache 2.0</text></g>
    <g transform="translate(745,48)"><rect width="135" height="84" rx="10" fill="#e1ecf7" stroke="#3a6ea5"/><text x="67" y="30" font-weight="700" fill="#1c3b5e">Dominio público</text><text x="67" y="54" font-size="12" fill="#333">CC0, Unlicense</text><text x="67" y="70" font-size="12" fill="#333">SQLite</text></g>
  </g>
  <line x1="40" y1="160" x2="860" y2="160" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <text x="40" y="182" font-size="13" fill="#555">Más restricciones · código cerrado</text>
  <text x="860" y="182" font-size="13" fill="#555" text-anchor="end">Más libertades · código abierto</text>
</svg>
