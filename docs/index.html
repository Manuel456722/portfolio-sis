<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Portfolio técnico · Sistemas Informáticos</title>
    <meta name="description" content="Portfolio técnico del módulo Sistemas Informáticos (DAM) hecho con Docsify" />

    <!-- Tema visual: core de Docsify v5 + modo oscuro automático (add-on) -->
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@5/dist/themes/core.min.css" />
    <link
      rel="stylesheet"
      href="//cdn.jsdelivr.net/npm/docsify@5/dist/themes/addons/core-dark.min.css"
      media="(prefers-color-scheme: dark)"
    />

    <style>
      :root {
        --theme-color: #1f6feb;
      }
    </style>
  </head>

  <body class="loading">
    <div id="app"></div>

    <script>
      window.$docsify = {
        // Campos obligatorios de la actividad
        name: 'Portfolio SIS',
        loadSidebar: true,

        // Ajustes recomendados
        repo: 'https://github.com/Manuel456722/portfolio-sis',
        coverpage: true,
        subMaxLevel: 2,
        auto2top: true,
        relativePath: false,
        notFoundPage: true,

        search: {
          placeholder: 'Buscar…',
          noData: 'Sin resultados',
          depth: 3,
        },

        copyCode: {
          buttonText: 'Copiar',
          successText: 'Copiado',
          errorText: 'Error',
        },
      };
    </script>

    <!-- Docsify v5 -->
    <script src="//cdn.jsdelivr.net/npm/docsify@5"></script>

    <!-- Plugins -->
    <script src="//cdn.jsdelivr.net/npm/docsify@5/dist/plugins/search.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify@5/dist/plugins/zoom-image.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify-copy-code@3"></script>

    <!-- Resaltado de sintaxis para los lenguajes usados en el portfolio -->
    <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-powershell.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-batch.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-yaml.min.js"></script>
  </body>
</html>
